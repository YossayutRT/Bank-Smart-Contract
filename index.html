<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BankBoo DApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="student">
      <div>
        <p class="who">ชื่อ-สกุล: <strong id="studentName">ยศยุต ฤธาทิพย์</strong></p>
        <p class="who">รหัสนักศึกษา: <strong id="studentId">66033872</strong></p>
      </div>
      <button id="connectBtn" class="primary">เชื่อมต่อ MetaMask</button>
    </header>

    <h1>BankBoo</h1>
    <p class="sub">ฝาก ถอน และตรวจสอบยอด ETH ผ่าน Smart Contract</p>

    <section class="status" aria-live="polite">
      <div><span>กระเป๋า</span><b id="accountText">ยังไม่เชื่อมต่อ</b></div>
      <div><span>เครือข่าย</span><b id="networkText">-</b></div>
      <div><span>ETH ในกระเป๋า</span><b id="walletText">-</b></div>
    </section>

    <section class="balance">
      <span>ยอดฝากใน BankBoo</span>
      <p><b id="vaultBalance">-</b> ETH</p>
      <button id="checkBtn" class="act ghost" disabled>ตรวจสอบยอด</button>
    </section>

    <section class="form">
      <label for="amount">จำนวน (ETH)</label>
      <input id="amount" type="text" inputmode="decimal" placeholder="เช่น 0.01" autocomplete="off">
      <div class="row">
        <button id="depositBtn" class="act primary" disabled>ฝาก</button>
        <button id="withdrawBtn" class="act dark" disabled>ถอน</button>
      </div>
    </section>

    <section class="activity">
      <h2>ประวัติการใช้งาน</h2>
      <ul id="log"><li class="info">เชื่อมต่อ MetaMask เพื่อเริ่มใช้งาน</li></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
